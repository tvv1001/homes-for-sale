backend:
  name: github
  repo: tvv1001/homes-for-sale
  branch: main
  use_pkce: true # Allows logging in without a backend server
  app_id: YOUR_GITHUB_OAUTH_APP_CLIENT_ID # YOU MUST REPLACE THIS

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "data"
    label: "Data Files"
    delete: false
    editor:
      preview: false
    files:
      - name: "listings"
        label: "Listings Data"
        file: "assets/listings.json"
        description: "Manage all property listings here."
        fields:
          - name: "listings"
            label: "Listings"
            widget: "list"
            fields:
              - {name: "id", label: "ID (slug-like, e.g. dallas-texas)", widget: "string"}
              - {name: "title", label: "Title", widget: "string"}
              - {name: "sub", label: "Subtitle", widget: "string"}
              - {name: "address", label: "Address", widget: "text"}
              - {name: "price", label: "Price", widget: "string"}
              - {name: "parcelNumber", label: "Parcel Number", widget: "string", required: false}
              - {name: "parcelUrl", label: "Parcel URL", widget: "string", required: false}
              - {name: "beds", label: "Beds", widget: "number", required: false}
              - {name: "baths", label: "Baths", widget: "number", required: false}
              - {name: "sqft", label: "Sqft", widget: "number", required: false}
              - {name: "areaUnit", label: "Area Unit", widget: "string", required: false, default: "Sqft"}
              - {name: "year", label: "Year Built", widget: "number", required: false}
              - {name: "mapUrl", label: "Map URL", widget: "string", required: false}
              - {name: "mapLabel", label: "Map Label", widget: "string", required: false}
              - name: "contact"
                label: "Contact"
                widget: "object"
                required: false
                fields:
                  - {name: "label", label: "Label", widget: "string"}
                  - {name: "url", label: "URL", widget: "string"}
              - {name: "description", label: "Description", widget: "markdown"}
              - name: "featuresGroups"
                label: "Features Groups"
                widget: "list"
                required: false
                fields:
                  - {name: "heading", label: "Heading", widget: "string"}
                  - name: "items"
                    label: "Items"
                    widget: "list"
                    fields:
                      - {name: "label", label: "Label", widget: "string"}
                      - {name: "value", label: "Value", widget: "string", required: false}
                      - name: "subitems"
                        label: "Subitems"
                        widget: "list"
                        required: false
                        fields:
                          - {name: "label", label: "Label", widget: "string"}
                          - {name: "value", label: "Value", widget: "string"}
              - name: "priceHistory"
                label: "Price History"
                widget: "list"
                required: false
                fields:
                  - {name: "date", label: "Date", widget: "date", format: "YYYY-MM-DD", required: false}
                  - {name: "price", label: "Price", widget: "string"}
                  - {name: "event", label: "Event", widget: "string"}
              - name: "images"
                label: "Images"
                widget: "list"
                required: false
                field: {name: "image", label: "Image", widget: "image"}
